<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/formulario.css"> 
    <title>Playhear</title>
</head>
<body>

    <header>
        <div class="logo">
            <img src="../img/logo_site.png" alt="Playhear">
        </div>

        <nav>
            <a href="formulario.html">Formulário</a>
            <a href="dashboard.html">Dashboard</a>
            <a href="../index.html" class="login">Sair</a>
        </nav>
    </header>
    <!-- Seção inicial -->

    <div class="imagem_fundo">

        <div class="conteudo1">

            <h1 class="titulo_cor titulo_home titulo_centro">Formulário</h1>

            <div class="grupo-formulario">
                <label for="ipt_jogo">Escreva um jogo:</label>
                <input type="text" id="ipt_jogo" placeholder="Ex: Meu jogo favorito 2.X" maxlength="50">
            </div>

            <div class="grupo-formulario">
                <label for="ipt_genero_jogo">Qual o gênero desse jogo?:</label>
                <input type="text" id="ipt_genero_jogo" placeholder="Ex: RogueLike">
            </div>

            <div class="grupo-formulario">
                <label for="ipt_tempo_jogo">Por quanto tempo jogou esse jogo hoje?(em horas):</label>
                <input type="text" id="ipt_tempo_jogo" placeholder="Ex: 3">
            </div>

            <div class="grupo-formulario">
                <label for="ipt_musica">Escreva uma musica:</label>
                <input type="text" id="ipt_musica" placeholder="Ex: Minha musica favorita">
            </div>

            <div class="grupo-formulario">
                <label for="ipt_genero_musica">Qual o gênero dessa musica:</label>
                <input type="text" id="ipt_genero_musica" placeholder="Ex: Pop">
            </div>

            <div class="grupo-formulario">
                <label for="ipt_tempo_musica">Por quanto tempo ouviu essa musica?(em minutos):</label>
                <input type="text" id="ipt_tempo_musica" placeholder="Ex: 2">
            </div>

            <button onclick="responder()" id="responder">Responder</button><br> 
        </div>
    </div>

    <section id="sobre">
        <h2>Sobre o projeto</h2>

        <p>
            Esse projeto NÃO possui fins lucrativos ou de divulgação,<br>
            o playhear é apenas um projeto educacional feito para demonstrar minha paixão por trilhas sonoras de jogos
        </p>
    </section>

    <footer>
        <p>Música e Videogame © 2026</p>
    </footer>

</body>
<script>
    function enviar(rota, nome, tempo, genero) {
        return fetch(`/${rota}/cadastrar`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                nomeServer: nome,
                tempoServer: tempo,
                idUsuarioServer: sessionStorage.ID_USUARIO,
                generoServer: genero          // agora vai o texto, não o id
            })
        });
    }

    function responder() {
        var jogo = ipt_jogo.value.trim();
        var generoJogo = ipt_genero_jogo.value.trim();
        var tempoJogo = ipt_tempo_jogo.value.replace(",", ".");
        var musica = ipt_musica.value.trim();
        var generoMusica = ipt_genero_musica.value.trim();
        var tempoMusica = ipt_tempo_musica.value.replace(",", ".");

        if (!jogo || !generoJogo || !musica || !generoMusica
            || isNaN(tempoJogo) || tempoJogo == "" || isNaN(tempoMusica) || tempoMusica == "") {
            alert("Preencha todos os campos corretamente.");
            return;
        }

        enviar("jogo", jogo, tempoJogo, generoJogo).then(function (r) {
            if (!r.ok) throw "Erro ao salvar o jogo";
            return enviar("musica", musica, tempoMusica, generoMusica);
        }).then(function (r) {
            if (!r.ok) throw "Erro ao salvar a música";
            alert("Respostas enviadas!");
        }).catch(function (erro) {
            alert(erro);
        });
    }
</script>
</html>
