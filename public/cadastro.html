<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Playhear - Criar Conta</title>
    <link rel="icon" type="image/png" href="./img/logo_site.png">
    <link rel="stylesheet" href="./css/login_e_cadastro.css">
</head>

<body>

    <div class="lado-esquerdo">
        <div class="conteiner-logo">
            <img class="imagem-logo" src="./img/logo_site.png" alt="Playhear Logo">
        </div>
    </div>

    <div class="lado-direito">
        <div id="toast" class="hidden show"></div>
        <h1>Criar conta</h1>
        <h2>Preencha os dados para começar</h2>

        <div class="grupo-formulario">
            <label for="ipt_nome">Nome</label>
            <input type="text" id="ipt_nome" placeholder="Ex: João da Silva">
        </div>

        <div class="grupo-formulario">
            <label for="ipt_email">Digite o seu e-mail</label>
            <input type="email" id="ipt_email" placeholder="Ex: seuemail@exemplo.com">
        </div>

        <div class="grupo-formulario">
            <label for="ipt_senha">Digite a senha</label>
            <input type="password" id="ipt_senha" placeholder="********" onkeyup="validarsenha()">
            <div id="div_senha"></div>
        </div>

        <div class="grupo-formulario">
            <label for="ipt_conf_senha">Confirme a senha</label>
            <input type="password" id="ipt_conf_senha" placeholder="********" onkeyup="senhaigual()">
            <div id="div_conf_senha"></div>
        </div>
        <button onclick="cadastrar()" id="cadastro">Cadastrar</button><br> 
        <a href="login.html" class="link-login">Já possui cadastro? Faça o login</a>

        <div class="secao-cadastro">
            <label></label>
            <button onclick="voltar()">Início</button>
        </div>
    </div>
</body>

<script>
            const showToastBtn = document.getElementById('cadastro');
            const toast = document.getElementById('toast');
            showToastBtn.addEventListener('click', function() {
            toast.classList.remove('hidden');
            toast.classList.add('show');
            setTimeout(function() {
                    toast.classList.add('hidden');
                }, 5000);
            });
            function cadastrar() {
            let nome = ipt_nome.value
            let email = ipt_email.value
            let conf_senha = ipt_conf_senha.value
            let senha = ipt_senha.value;
            let msg = ``;

            let requisitos = ["Ter pelo menos 8 caracteres", "Possuir pelo menos uma letra"];
            let atendidos = 0;

            for (let i = 0; i < requisitos.length; i++) {

                if (i == 0 && senha.length >= 8) {
                    atendidos++;
                }
                else if (senha.toLowerCase() != senha.toUpperCase()) {
                    atendidos++;
                }   
            }

            if (atendidos < 2){
                toast.innerHTML = `<span style="color: red;">Senha precisa atender aos 2 requisitos</span>`;
            } 
            else {
                toast.innerHTML = `<span style="color: green;">Senha válida</span>`;
            }

            div_senha.innerHTML = `${msg}`;
        

            if (nome == "" || email == "" ||  senha == "" || conf_senha == "" ) {
                toast.innerHTML = 'Preencha os dados corretamente'
             
            }else if (senha != conf_senha) {
                toast.innerHTML = 'As senhas não coincidem!';
            }else {
                fetch("/usuarios/cadastrar", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ nomeServer: nome, emailServer: email, senhaServer: senha })
                }).
                    then(function (resposta) {
                    if (resposta.ok) {
                        toast.innerHTML = "Cadastro concluído! Você será redirecionado, aguarde.";
                        setTimeout(() => { window.location = "login.html"; }, 3000);
                    } else {
                            resposta.text().then(function (texto) {
                            console.log("Erro do servidor:", texto);
                            toast.innerHTML = "Erro ao cadastrar: " + texto;
                            });
                        }
                }).catch(function (erro) {
                    console.log(erro);
                });
            }
               
        }

        function validarsenha(){
            let senha = ipt_senha.value
            let msg = ``;

            if (senha.length < 8){
                msg = `<span style="color: red;">Senha precisa de 8 caracteres</span>`;
            } 
            else {
                msg = `<span style="color: green;">Senha válida</span>`
            } 

            div_senha.innerHTML = `${msg}`;
        }   
        
        function senhaigual(){
            let senha = ipt_senha.value;
            let conf_senha = ipt_conf_senha.value
            let msg = ``;
            
            if (senha != conf_senha){
                msg = `<span style="color: red;"> As senhas não são iguais </span>`;
            }
            else {
                msg = `<span style="color: green;"> As senhas são iguais </span>`;
                
            }
            div_conf_senha.innerHTML = `${msg}`;
        }

        function voltar(){
            setTimeout(() => {
                    window.location = "index.html";
                }, "1000");
        }
</script>
</html>
